[package]
edition = "2024"
name = "ffi-async"
version = "0.1.0"
authors = ["Ethan D. Twardy <ethan.twardy@gmail.com>"]
resolver = "2"

[[bin]]
name = "ffi-async"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
critical-section = "1.2.0"
defmt = "1.0"
defmt-rtt = "1.1"

embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.4", features = ["defmt", "stm32h755zi-cm7", "unstable-pac", "memory-x", "time-driver-any"]  }
embassy-sync = "0.7.2"
embassy-time = "0.5.0"

panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.53"
